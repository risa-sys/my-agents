name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - "daily-task-agent.gs"
      - "appsscript.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo "${{ secrets.CLASP_CREDENTIALS }}" > ~/.clasprc.json

      - name: Write .clasp.json
        run: echo '{"scriptId":"${{ secrets.CLASP_SCRIPT_ID }}"}' > .clasp.json

      - name: Push to Apps Script
        run: clasp push -f

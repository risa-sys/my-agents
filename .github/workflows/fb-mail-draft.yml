name: Facebook mail approval - draft (fukushima-ichiba)

# メール承認: 投稿案を作り、Apps Script(承認メール)に署名つきで送る。
# - kind=week … 7日分(1日1件・各日18:00公開予定)をまとめて送る(承認メール1通)。start_date 空欄なら自動で決める
# - kind=three … 3件を作り、承認メールを1件ずつ送る(承認を確定すると、その1件をすぐ公開)
# - kind=one  … 1件だけ送る(承認を確定すると、すぐ公開)
# - kind=resend … 送った7日分の承認メールを送り直す(batch_id。内容・日付・判断はそのまま、リンクは作り直す)。
#                 batch_id 空欄なら、判断待ちの1件ずつの承認メールを送り直す
# - kind=reschedule … 送った7日分の公開予定日を変える(batch_id と dates)。内容・判断はそのまま、承認メールを送り直す
# - 手動実行のみ(schedule なし)。このワークフローは Facebook へは一切通信しない(公開は承認後に fb-mail-publish.yml)
# - 承認前の投稿案は、公開のログ・成果物・fb-history に残さない(ログには投稿案IDと成否だけ)
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "three=3件(承認ですぐ公開) / week=7日分 / one=1件 / reschedule=公開予定日の変更 / resend=承認メールの再送"
        type: choice
        options: [three, week, one, reschedule, resend]
        default: three
      start_date:
        description: "7日分の最初の公開予定日(YYYY-MM-DD・日本時間)。空欄なら明日以降で予定・記録と重ならない最初の7日間"
        type: string
        required: false
      batch_id:
        description: "reschedule / resend: まとめID"
        type: string
        required: false
      dates:
        description: "reschedule: 新しい公開予定日(今の予定の早い順に、YYYY-MM-DD をカンマ区切り)"
        type: string
        required: false

concurrency:
  group: fb-mail-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # 履歴は読むだけ(書き込まない)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore history (fb-history branch, read only)
        run: bash scripts/fb-history-branch.sh restore

      - name: Create drafts and send the approval mail
        if: inputs.kind == 'week' || inputs.kind == 'one' || inputs.kind == 'three'
        env:
          MODE: ${{ inputs.kind == 'week' && 'mail-week' || 'mail-draft' }}
          COUNT: ${{ inputs.kind == 'three' && '3' || '1' }}
          START_DATE: ${{ inputs.start_date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_MAIL_GAS_URL: ${{ secrets.FB_MAIL_GAS_URL }}
          FB_MAIL_SECRET: ${{ secrets.FB_MAIL_SECRET }}
        run: node scripts/fb-draft-post.mjs

      - name: Change the publish dates and resend the approval mail
        if: inputs.kind == 'reschedule' || inputs.kind == 'resend'
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          DATES: ${{ inputs.dates }}
          RESEND: ${{ inputs.kind == 'resend' && '1' || '' }}
          FB_MAIL_GAS_URL: ${{ secrets.FB_MAIL_GAS_URL }}
          FB_MAIL_SECRET: ${{ secrets.FB_MAIL_SECRET }}
        run: node scripts/fb-mail-reschedule.mjs

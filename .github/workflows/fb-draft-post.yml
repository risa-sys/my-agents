name: Facebook draft post (fukushima-ichiba)

# 自動実行(schedule)は行わない。手動実行のみ。
# 既定は preview(翌週7日分の投稿案を作るだけで、Facebookへは一切通信しない)。
# 下書き保存(draft)は週次版が完成するまで停止中。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview=翌週7日分の投稿案とプレビュー生成(Facebook通信なし) / models=Geminiの利用可能モデル確認(Facebook通信なし) / check=トークン確認のみ(読み取り)"
        type: choice
        options: [preview, models, check]
        default: preview
      week_start:
        description: "preview のみ: 対象週の初日(YYYY-MM-DD)。空なら翌週の月曜日"
        type: string
        required: false
        default: ""
      models_probe:
        description: "models のみ: 呼び出して確かめるモデル名(カンマ区切り・最大3つ。1日の上限を1回ずつ消費)。空なら一覧の表示だけ"
        type: string
        required: false
        default: ""

concurrency:
  group: fb-draft-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # Gemini の待機・再試行を含めても、これ以上は止める
    permissions:
      contents: read # この job は書き込まない(履歴の保存は save-history job だけが行う)
      issues: write # トークンの期限が近いときに Issue で知らせるため(check のみ)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore candidate history (fb-history branch)
        if: ${{ inputs.mode == 'preview' }}
        run: bash scripts/fb-history-branch.sh restore

      - name: Run (${{ inputs.mode }})
        id: post
        env:
          MODE: ${{ inputs.mode }}
          WEEK_START: ${{ inputs.week_start }}
          MODELS_PROBE: ${{ inputs.models_probe }}
          # preview / models には Facebook のトークンを渡さない
          FB_PAGE_ID: ${{ inputs.mode == 'check' && secrets.FB_PAGE_ID || '' }}
          FB_PAGE_ACCESS_TOKEN: ${{ inputs.mode == 'check' && secrets.FB_PAGE_ACCESS_TOKEN || '' }}
          GEMINI_API_KEY: ${{ (inputs.mode == 'preview' || inputs.mode == 'models') && secrets.GEMINI_API_KEY || '' }}
        run: node scripts/fb-draft-post.mjs

      - name: Upload preview and history
        if: ${{ inputs.mode == 'preview' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fb-weekly-preview
          path: |
            preview/*.html
            data/fb-post-history.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload history for save-history job
        if: ${{ inputs.mode == 'preview' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: fb-history-to-save
          path: data/fb-post-history.json
          retention-days: 1

      - name: Notify token expiry
        if: ${{ steps.post.outputs.token_days_left != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRES: ${{ steps.post.outputs.token_expires }}
          DAYS_LEFT: ${{ steps.post.outputs.token_days_left }}
        run: |
          title="Facebookトークンの有効期限が近づいています"
          if [ -n "$(gh issue list --state open --search "in:title $title" --json number --jq '.[].number')" ]; then exit 0; fi
          gh issue create --title "$title" --body "FB_PAGE_ACCESS_TOKEN の有効期限: ${EXPIRES}(残り${DAYS_LEFT}日)

          Meta Business Suite のシステムユーザーでトークンを再生成し、
          \`gh secret set FB_PAGE_ACCESS_TOKEN\` で差し替えてください。差し替えたらこの Issue を閉じてください。"

  # 候補履歴を専用ブランチ fb-history に保存する(次回の生成で前後30日の重複防止に使う)。
  # main には書き込まない。書き込み権限を持つのはこの job だけで、生成処理は動かさない。
  save-history:
    needs: run
    if: ${{ inputs.mode == 'preview' && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fb-history-to-save
          path: data

      - name: Save candidate history to fb-history branch
        run: bash scripts/fb-history-branch.sh save
